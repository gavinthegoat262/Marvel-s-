<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Port Halcyon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  --hud:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--big:'Anton',Impact,'Arial Black',sans-serif;--gold:#f5c542;--green:#5fd068}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}.panel{touch-action:pan-y}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:var(--hud);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
body.playing #hud{display:block}
.o{text-shadow:-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000,0 2px 6px rgba(0,0,0,.6)}
#hudMini{position:absolute;left:calc(14px + var(--sal));top:calc(14px + var(--sat));width:190px;height:190px;border-radius:50%;overflow:hidden;border:3px solid rgba(0,0,0,.75);box-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer;background:#3d6f9c}
#mini{width:100%;height:100%;display:block}
#topRight{position:absolute;right:calc(16px + var(--sar));top:calc(10px + var(--sat));display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#row1{display:flex;align-items:center;gap:12px}
#clock{font-size:30px;font-weight:700;letter-spacing:1px}
#weaponBox{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:4px 10px;min-width:96px;justify-content:center;cursor:pointer}
#wIcon{font-family:var(--big);font-size:24px;letter-spacing:1px}
#wAmmo{font-size:20px;font-weight:700}
#money{font-family:var(--big);font-size:38px;color:var(--green);letter-spacing:1px;line-height:1.05}
#bars{display:flex;flex-direction:column;gap:4px;width:210px}
.bar{height:9px;background:rgba(0,0,0,.55);border:1px solid rgba(0,0,0,.8);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(#ff5a5a,#c51a1a);transition:width .25s}
.bar.arm i{background:linear-gradient(#7fb4ff,#2d6fe0)}
#stars{font-size:34px;letter-spacing:2px;line-height:1;color:rgba(0,0,0,.35);-webkit-text-stroke:1px rgba(255,255,255,.25);margin-top:2px}
#stars b{color:#fff;-webkit-text-stroke:1.5px #000;font-weight:400}
#stars.flash b{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
#helpBox{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + var(--sat));max-width:min(520px,60vw);background:rgba(0,0,0,.72);border-radius:8px;padding:10px 16px;font-size:19px;line-height:1.3;font-weight:600;display:none;text-align:left}
#helpBox kbd{display:inline-block;background:#fff;color:#000;border-radius:4px;padding:0 6px;font:700 15px var(--hud);margin:0 2px}
#objective{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--sab));font-size:26px;font-weight:700;text-align:center;max-width:80vw;display:none}
#objective .y{color:var(--gold)}#objective .b{color:#6fb7ff}#objective .r{color:#ff6b6b}#objective .g{color:var(--green)}
#timer{position:absolute;right:calc(18px + var(--sar));top:calc(178px + var(--sat));font-size:30px;font-weight:800;display:none}
#bigText{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--big);font-size:min(13vw,96px);letter-spacing:2px;display:none;line-height:1}
#bigText small{display:block;font-size:.42em;color:#fff;margin-top:10px}
#toasts{position:absolute;left:calc(16px + var(--sal));top:calc(218px + var(--sat));display:flex;flex-direction:column;gap:6px;max-width:40vw}
.toast{background:rgba(0,0,0,.66);padding:6px 12px;border-radius:6px;font-size:18px;font-weight:600;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateX(-12px)}}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;display:none}
#cross:before,#cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:12px;top:0;width:2px;height:26px}#cross:after{top:12px;left:0;height:2px;width:26px}
#cross.dot:before{left:11px;top:11px;width:4px;height:4px;border-radius:50%}#cross.dot:after{display:none}
#cross.lock:before,#cross.lock:after{background:#ff4a4a}
#hitm{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0;transition:opacity .12s}
#hitm:before,#hitm:after{content:'';position:absolute;left:14px;top:-2px;width:2px;height:34px;background:#fff;transform:rotate(45deg)}#hitm:after{transform:rotate(-45deg)}
#hitm.k:before,#hitm.k:after{background:#ff3030}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(190,0,0,.55) 100%);opacity:0;transition:opacity .2s}
#lowhp{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(120,0,0,.5) 100%);opacity:0}
#speedo{position:absolute;right:calc(22px + var(--sar));bottom:calc(22px + var(--sab));text-align:right;display:none}
#speedo b{font-family:var(--big);font-size:54px;line-height:1}#speedo small{font-size:18px;margin-left:4px;font-weight:700}
#carNm{font-size:20px;font-weight:700;color:#ddd}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(120px + var(--sab));background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 16px;font-size:20px;font-weight:700;display:none;white-space:nowrap}
#prompt kbd{display:inline-block;background:#f5c542;color:#111;border-radius:4px;padding:0 7px;margin-right:6px;font:800 16px var(--hud)}
body.touch #prompt{bottom:calc(150px + var(--sab));font-size:16px}
#radioNm{position:absolute;left:50%;top:calc(16px + var(--sat));transform:translateX(-50%);font-size:24px;font-weight:800;color:var(--gold);display:none}
#fps{position:absolute;left:calc(14px + var(--sal));bottom:calc(8px + var(--sab));font:600 13px monospace;opacity:.7;display:none}
#btnPause{position:absolute;pointer-events:auto;left:calc(156px + var(--sal));top:calc(14px + var(--sat));width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;font:800 16px var(--hud);display:none;cursor:pointer}
body.touch #btnPause{display:block}
/* touch controls */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
body.touch.playing #touch{display:block}
#joy{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;left:110px;top:70%}
#joy.on{display:block}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.55);transform:translate(-50%,-50%)}
#joyHint{position:absolute;left:calc(40px + var(--sal));bottom:calc(40px + var(--sab));width:110px;height:110px;border-radius:50%;border:2px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(255,255,255,.5);text-align:center}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);color:#fff;font:800 15px var(--hud);letter-spacing:.5px;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;backdrop-filter:blur(2px)}
.tbtn.on{background:rgba(255,255,255,.35)}
.tbtn.lit{border-color:#ff5a5a;color:#ff8a8a}
#bFire{width:88px;height:88px;right:calc(26px + var(--sar));bottom:calc(30px + var(--sab));font-size:18px;background:rgba(190,30,30,.45)}
#bJump{width:64px;height:64px;right:calc(128px + var(--sar));bottom:calc(22px + var(--sab))}
#bEnter{width:64px;height:64px;right:calc(36px + var(--sar));bottom:calc(132px + var(--sab))}
#bAim{width:58px;height:58px;right:calc(124px + var(--sar));bottom:calc(104px + var(--sab))}
#bKick{width:52px;height:52px;right:calc(196px + var(--sar));bottom:calc(64px + var(--sab))}
#bGas,#bBrk,#bHorn,#bRadio{display:none}
#bView{width:46px;height:46px;right:calc(106px + var(--sar));bottom:calc(196px + var(--sab));font-size:12px}
#bGas{width:84px;height:84px;right:calc(26px + var(--sar));bottom:calc(30px + var(--sab));background:rgba(40,160,60,.45)}
#bBrk{width:68px;height:68px;right:calc(124px + var(--sar));bottom:calc(20px + var(--sab));background:rgba(180,60,40,.4)}
#bHorn{width:50px;height:50px;right:calc(200px + var(--sar));bottom:calc(30px + var(--sab))}
#bRadio{width:50px;height:50px;right:calc(36px + var(--sar));bottom:calc(214px + var(--sab));font-size:13px}
body.incar #bGas,body.incar #bBrk,body.incar #bHorn,body.incar #bRadio{display:flex}
body.incar #bFire{width:60px;height:60px;right:calc(130px + var(--sar));bottom:calc(108px + var(--sab));font-size:13px}
body.incar #bJump{right:calc(200px + var(--sar));bottom:calc(96px + var(--sab));width:58px;height:58px;font-size:12px}
body.incar #bAim,body.incar #bKick,body.incar #joyHint{display:none}
body.touch #hudMini{width:132px;height:132px}
body.touch #toasts{top:calc(156px + var(--sat))}
body.touch #money{font-size:30px}body.touch #clock{font-size:24px}body.touch #bars{width:160px}body.touch #stars{font-size:26px}
body.touch #speedo{bottom:calc(6px + var(--sab));right:auto;left:50%;transform:translateX(-50%);text-align:center}body.touch #speedo b{font-size:34px}body.touch #carNm{font-size:15px}
body.touch #objective{bottom:auto;top:calc(64px + var(--sat));font-size:19px;max-width:56vw}body.touch #helpBox{font-size:15px;max-width:46vw;padding:8px 12px;left:calc(50% - 20px)}body.touch #helpBox kbd{display:none}
body.touch #timer{top:calc(150px + var(--sat))}
/* menus */
.menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,rgba(20,20,40,.55),rgba(0,0,0,.82));z-index:10;padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal))}
.menu.show{display:flex}
.panel{background:rgba(12,14,20,.92);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:22px 24px;width:min(560px,94vw);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.panel h2{font-family:var(--big);font-weight:400;font-size:34px;margin:0 0 10px;letter-spacing:1px}
.panel p{color:#c8ccd4;font-size:18px;line-height:1.35;margin:6px 0}
.btns{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.mbtn{font:700 21px var(--hud);letter-spacing:.5px;color:#fff;background:linear-gradient(#2b2f3a,#1c1f27);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:11px 16px;cursor:pointer;text-align:left;pointer-events:auto}
.mbtn:hover,.mbtn:focus{background:linear-gradient(#f5c542,#d79a12);color:#111;outline:none}
.mbtn.primary{background:linear-gradient(#f5c542,#d79a12);color:#111}
.mbtn.small{font-size:17px;padding:7px 12px}
.row{display:flex;gap:9px;flex-wrap:wrap}
#title{background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.75))}
#logo{font-family:var(--big);font-size:min(16vw,120px);line-height:.9;letter-spacing:2px;text-align:center;background:linear-gradient(180deg,#ffe28a 0%,#f5a524 45%,#d9480f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 8px 18px rgba(0,0,0,.7))}
#logoSub{text-align:center;font-weight:700;letter-spacing:6px;font-size:18px;color:#ffd;margin:6px 0 18px;text-shadow:0 2px 6px #000}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:19px;font-weight:600}
.set input[type=range]{width:46%}
.seg{display:flex;gap:4px}.seg button{font:700 16px var(--hud);padding:6px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.2);background:#222630;color:#fff;cursor:pointer}
.seg button.on{background:var(--gold);color:#111}
textarea{width:100%;height:90px;background:#0b0d12;color:#cfe;border:1px solid #333;border-radius:8px;font:13px monospace;padding:8px;user-select:text;-webkit-user-select:text}
table.ctl{width:100%;border-collapse:collapse;font-size:18px}table.ctl td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.07)}table.ctl td:first-child{color:var(--gold);font-weight:700;white-space:nowrap}
#mapPanel{position:fixed;inset:0;display:none;z-index:9;background:#0a1626}
#mapPanel.show{display:block}
#mapCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#mapTop{position:absolute;left:calc(14px + var(--sal));top:calc(12px + var(--sat));right:calc(14px + var(--sar));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#mapTop .mbtn{pointer-events:auto}
#legend{background:rgba(0,0,0,.6);border-radius:8px;padding:8px 12px;font-size:16px;line-height:1.5;pointer-events:none}
#legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.shopItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:19px}
.shopItem b{color:var(--gold)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#07080c;z-index:20;font:700 22px var(--hud);letter-spacing:3px}
#loading .bar2{width:240px;height:6px;background:#222;border-radius:3px;margin-top:14px;overflow:hidden}#loading .bar2 i{display:block;height:100%;width:30%;background:var(--gold);animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
#rotate{position:fixed;inset:auto 0 0 0;padding:10px;text-align:center;background:rgba(0,0,0,.6);font-size:16px;display:none;z-index:8;pointer-events:none}
@media (orientation:portrait){body.touch.playing #rotate{display:block}}
@media (max-height:430px){.panel{padding:14px 18px}.panel h2{font-size:26px;margin-bottom:4px}.mbtn{padding:8px 14px;font-size:18px}.btns{gap:6px;margin-top:8px}.panel p{font-size:15px}#hudMini{width:120px!important;height:120px!important}#money{font-size:26px!important}#stars{font-size:22px!important}#bars{width:140px!important}#clock{font-size:20px!important}#wIcon{font-size:18px}#wAmmo{font-size:16px}}
.ninput{font:700 20px var(--hud);background:#0b0d12;color:#fff;border:1px solid #444;border-radius:8px;padding:8px 10px;width:55%;user-select:text;-webkit-user-select:text;outline:none}
.ninput:focus{border-color:var(--gold)}.ninput.code{width:130px;text-transform:uppercase;letter-spacing:5px;text-align:center}
.ncode{font-size:20px;margin:10px 0 4px;display:flex;align-items:center;gap:12px}.ncode b{font-family:var(--big);font-weight:400;font-size:46px;letter-spacing:6px;color:var(--gold);user-select:text;-webkit-user-select:text}
#nList{margin:6px 0}#nList .np{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:600;padding:3px 0}#nList i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #000}
#netTags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ntag{position:absolute;transform:translate(-50%,-100%);font:700 17px var(--hud);white-space:nowrap;text-align:center;display:none;letter-spacing:.5px}
.ntag s{display:block;height:4px;width:44px;margin:2px auto 0;background:rgba(0,0,0,.65);border-radius:2px;overflow:hidden;text-decoration:none}.ntag s i{display:block;height:100%;width:100%;background:#ff5a5a}
.err{color:#ff8a8a;font-size:16px;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div>PORT HALCYON</div><div style="font-size:15px;color:#999;margin-top:6px">building the city…</div><div class="bar2"><i></i></div></div>
<div id="hud">
  <div id="netTags"></div>
  <div id="hudMini"><canvas id="mini" width="256" height="256"></canvas></div>
  <div id="topRight" class="o">
    <div id="row1"><div id="weaponBox"><span id="wIcon">✊</span><span id="wAmmo"></span></div><div id="clock">10:30</div></div>
    <div id="money">$0</div>
    <div id="bars"><div class="bar"><i id="hpBar"></i></div><div class="bar arm"><i id="arBar" style="width:0"></i></div></div>
    <div id="stars"></div>
  </div>
  <button id="btnPause">II</button>
  <div id="helpBox"></div>
  <div id="radioNm" class="o"></div>
  <div id="prompt"></div>
  <div id="timer" class="o"></div>
  <div id="objective" class="o"></div>
  <div id="bigText" class="o"></div>
  <div id="toasts"></div>
  <div id="cross"></div><div id="hitm"></div>
  <div id="vign"></div><div id="lowhp"></div>
  <div id="speedo" class="o"><b id="spd">0</b><small>km/h</small><div id="carNm"></div></div>
  <div id="fps"></div>
</div>
<div id="touch">
  <div id="joyHint">MOVE<br>drag here</div>
  <div id="joy"><div id="joyKnob"></div></div>
  <div class="tbtn" id="bFire" data-k="fire">FIRE</div>
  <div class="tbtn" id="bJump" data-k="jump">JUMP</div>
  <div class="tbtn" id="bEnter" data-k="enter">CAR</div>
  <div class="tbtn" id="bAim" data-k="aim">LOCK</div>
  <div class="tbtn" id="bKick" data-k="kick">KICK</div>
  <div class="tbtn" id="bGas" data-k="gas">GAS</div>
  <div class="tbtn" id="bBrk" data-k="brk">BRAKE</div>
  <div class="tbtn" id="bHorn" data-k="horn">HORN</div>
  <div class="tbtn" id="bRadio" data-k="radio">RADIO</div>
  <div class="tbtn" id="bView" data-k="cam">VIEW</div>
</div>
<div id="rotate">Turn your phone sideways for the best view</div>
<div id="mapPanel"><canvas id="mapCv"></canvas><div id="mapTop"><div id="legend"></div><button class="mbtn small" id="mapClose">Close map</button></div></div>
<div id="menu" class="menu"><div class="panel scroll" id="menuPanel"></div></div>
<script>
(function(){
// ---- 00_core.js ----
'use strict';
// ===================== CORE: math, rng, helpers =====================
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v;
const sstep = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function wrapAng(a) { a %= TAU; if (a > PI) a -= TAU; else if (a < -PI) a += TAU; return a; }
function damp(a, b, k, dt) { return lerp(a, b, 1 - Math.exp(-k * dt)); }
function dampAng(a, b, k, dt) { return a + wrapAng(b - a) * (1 - Math.exp(-k * dt)); }
function makeRng(seed) { let s = (seed >>> 0) || 0x9e3779b9; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
let RNG = Math.random; const rnd = () => RNG();
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const d2 = (ax, az, bx, bz) => { const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; };
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
function srgb(c) { return Math.pow(c, 2.2); }

  float az=atan(R.z,R.x); float hb=0.05+0.2*vn(vec2(az*5.,1.7))+0.12*step(0.55,vn(vec2(az*23.,3.1)))*vn(vec2(az*40.,9.));
  if(R.y>-0.01 && R.y<hb){ vec3 bc=mix(uSkyHor*0.42+uSunCol*0.07,vec3(0.01,0.012,0.018),uNight);
    vec2 wq=vec2(az*42.,R.y*30.); vec2 wc=floor(wq), wf=fract(wq); float w=step(0.6,h12(wc))*smoothstep(0.15,0.3,wf.x)*smoothstep(0.85,0.7,wf.x)*smoothstep(0.2,0.35,wf.y)*smoothstep(0.8,0.65,wf.y);
    bc+=vec3(1.,.78,.48)*w*uNight*0.55+vec3(.5,.6,.7)*w*(1.-uNight)*0.05; c=mix(c,bc,smoothstep(hb,hb-0.01,R.y)); }
  if(R.y<-0.01){ float t=max(P.y,0.05)/max(-R.y,0.04); vec3 gp=P+R*t; vec3 lm=texture(uLM,(gp.xz-uLMR.xy)*uLMR.zw).rgb;
    vec3 g=uGndCol*0.3*(1.-uNight*0.8)+lm*lm*uNight*2.2; c=mix(c,g,smoothstep(-0.01,-0.08,R.y)); }
  if(R.y>0.02 && uNight>0.02){ float t=(7.2-P.y)/R.y; if(t>0. && t<60.){ vec3 lp=P+R*t; vec3 lm=texture(uLM,(lp.xz-uLMR.xy)*uLMR.zw).rgb; c+=lm*lm*lm*uNight*6./(1.+t*0.08); } }
  float sg=pow(max(dot(R,uSunDir),0.),1600.); c+=uSunCol*sg*60.*(1.-uNight)*shadowAt(P,n);
  for(int i=0;i<${MAXL};i++){ if(i>=uNL) break; vec3 L=uLP[i].xyz-P; float d=length(L); L/=max(d,1e-3); float g=pow(max(dot(R,L),0.),700.); c+=uLC[i].rgb*g*28./(1.+d*d*0.012); }
  return c;
}

function glProgram(vs, fs) {
  const gl = REN.gl, pre = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, pre + src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const log = gl.getShaderInfoLog(s); console.error(log, src.split('\n').map((l, i) => (i + 4) + ': ' + l).join('\n')); throw new Error('Shader: ' + log); } return s; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link: ' + gl.getProgramInfoLog(p));
  p.u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const nm = info.name.replace('[0]', ''); p.u[nm] = gl.getUniformLocation(p, info.name); }
  return p;
}

REN.makeShadow = function (size) {
  const gl = REN.gl;
  if (REN.shTex) { gl.deleteTexture(REN.shTex); gl.deleteFramebuffer(REN.shFB); }
  REN.shadowSize = size;
  REN.shTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, REN.shTex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, size, size);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  REN.shFB = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, REN.shFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, REN.shTex, 0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
};
REN.uploadCanvasTex = function (tex, cvs, mip) {
  const gl = REN.gl; gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cvs);

  else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
};

// ===================== HIGH-DETAIL MODELS: smooth surfaces, cars, wheels, character parts =====================
const _cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const _sb = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const _nz = a => { const l = Math.hypot(a[0], a[1], a[2]); return l < 1e-12 ? null : [a[0] / l, a[1] / l, a[2] / l]; };
// parametric surface with smooth normals. P(u,v)->[x,y,z]. M(u,v,n,p)->[col,m0,m1] or null (skip face).
// o.cu / o.cv: closed in u / v. o.c(u,v)->[x,y,z] inside point used to orient normals outward.
MB.prototype.surf = function (nu, nv, P, M, o = {}) {
  const G = [], N = [];
  for (let j = 0; j <= nv; j++) { const r = []; for (let i = 0; i <= nu; i++) r.push(P(i / nu, j / nv)); G.push(r); }
  for (let j = 0; j <= nv; j++) { const r = []; for (let i = 0; i <= nu; i++) {
    const ia = o.cu ? (i + 1) % nu : Math.min(nu, i + 1), ib = o.cu ? (i - 1 + nu) % nu : Math.max(0, i - 1);
    const ja = o.cv ? (j + 1) % nv : Math.min(nv, j + 1), jb = o.cv ? (j - 1 + nv) % nv : Math.max(0, j - 1);
    const p = G[j][i]; let n = _nz(_cr(_sb(G[j][ia], G[j][ib]), _sb(G[ja][i], G[jb][i])));

    marker(c) { return { x: c.vic.x, z: c.vic.z, y: c.vic.y + c.vic.def.H + 1, arrow: true, col: [1, .25, .2], noCyl: true }; } }; },

function reachablePoint(rng, b) { const [x0, z0, x1, z1] = b.r; for (let t = 0; t < 30; t++) { const x = lerp(x0 + 5, x1 - 5, rng()), z = lerp(z0 + 5, z1 - 5, rng());

function setupWorldPickups() {
  const rng = makeRng(4242); GAME.pickups = []; WORLD.packages = [];
  const L = WORLD.locs;
  spawnPickup('health', L.hospital.x + 3, L.hospital.z, { respawn: 60 }); spawnPickup('armor', L.police.x + 3, L.police.z, { respawn: 90 });
  spawnPickup('weapon', L.safehouse.x + 4, L.safehouse.z + 1, { weapon: 'pistol', ammo: 36, respawn: 120, life: Infinity });
  const cand = WORLD.blocks.filter(b => b.d !== 'downtown');
  const spots = [];
  // packages in reachable places
  for (let k = 0; spots.length < 16 && k < 400; k++) { const b = cand[Math.floor(rng() * cand.length)]; const p = reachablePoint(rng, b); if (p && !spots.some(s => d2(s.x, s.z, p.x, p.z) < 120 * 120)) spots.push(p); }
  for (const p of WORLD.piers) spots.push({ x: (p[0] + p[2]) / 2, z: p[1] + 3 });
  spots.push({ x: 452, z: 300 }, { x: -425, z: -425 }, { x: 425, z: 425 }, { x: 0, z: 425 });
  spots.forEach((s, i) => { WORLD.packages.push(s); if (!GAME.packages.includes(i)) spawnPickup('package', s.x, s.z, { idx: i, life: Infinity }); });
  // health/armor/weapons around town
  for (let k = 0; k < 7; k++) { const b = cand[Math.floor(rng() * cand.length)]; const p = reachablePoint(rng, b); if (p) spawnPickup(k < 5 ? 'health' : 'armor', p.x, p.z, { respawn: 90 }); }
  const park = blockRect(2, 4); spawnPickup('weapon', park[0] + 8, park[1] + 8, { weapon: 'shotgun', ammo: 12, respawn: 180, life: Infinity });
  spawnPickup('weapon', -237, -516, { weapon: 'rifle', ammo: 60, respawn: 240, life: Infinity });
  spawnPickup('weapon', 440, -60, { weapon: 'smg', ammo: 60, respawn: 180, life: Infinity });
  if (GAME.packages.length >= WORLD.packages.length && WORLD.packages.length) setupSafehouseRewards();
}

// ---------- save / load ----------
const SAVE_KEY = 'portHalcyon.save.v1', SET_KEY = 'portHalcyon.settings.v1'; let MEM_SAVE = null;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function hasSave() { return !!(lsGet(SAVE_KEY) || MEM_SAVE); }
function saveData() { const p = GAME.player; return { v: 1, money: GAME.money, armor: Math.round(p.armor), weapons: p.weapons, weapon: p.weapon, done: GAME.done, packages: GAME.packages, stunts: GAME.stunts, stats: GAME.stats, hour: ENV.hour, outfit: GAME.outfit, outfits: GAME.outfits }; }
function saveGame() { if (!GAME.player) return; const s = JSON.stringify(saveData()); MEM_SAVE = s; lsSet(SAVE_KEY, s); }
function applySave(d) {
  newGame(); GAME.money = d.money | 0; GAME.done = (d.done || []).filter(id => MISSIONS.some(m => m.id === id)); GAME.packages = d.packages || []; GAME.stunts = d.stunts || [];
  Object.assign(GAME.stats, d.stats || {}); const p = GAME.player; p.weapons = Object.assign({ fists: { ammo: 0, mag: 0 } }, d.weapons || {}); p.weapon = WEAP[d.weapon] ? d.weapon : 'fists'; p.armor = clamp(d.armor | 0, 0, 100);
  if (typeof d.hour === 'number') ENV.hour = d.hour; GAME.outfits = Array.isArray(d.outfits) && d.outfits.length ? d.outfits : ['street']; wearOutfit(d.outfit || 'street'); setupWorldPickups();
}
function loadGame() { const s = lsGet(SAVE_KEY) || MEM_SAVE; if (!s) { newGame(); return; } try { applySave(JSON.parse(s)); } catch (e) { console.warn('bad save', e); newGame(); } }
function exportSave() { saveGameIfRunning(); const s = lsGet(SAVE_KEY) || MEM_SAVE || JSON.stringify({ v: 1, money: 0, done: [], packages: [], stunts: [] }); try { return 'PH1:' + btoa(unescape(encodeURIComponent(s))); } catch (e) { return ''; } }
function saveGameIfRunning() { if (GAME.running && GAME.player) saveGame(); }
function importSave(code) { try { const raw = code.replace(/\s+/g, ''); if (!raw.startsWith('PH1:')) return false; const s = decodeURIComponent(escape(atob(raw.slice(4)))); const d = JSON.parse(s); if (d.v !== 1) return false; MEM_SAVE = s; lsSet(SAVE_KEY, s); return true; } catch (e) { return false; } }
function saveSettings() { lsSet(SET_KEY, JSON.stringify(GAME.settings)); }
function loadSettings() { const s = lsGet(SET_KEY); if (s) try { Object.assign(GAME.settings, JSON.parse(s)); } catch (e) { } }

  const pl = GAME.player;
  if (pl) { const a = pl.anim; const pu = a.punch > 0, ki = a.kick > 0;
    if (pu && !NET._pu) netSend({ t: 'mel', k: 0, s: a.punchSide }); if (ki && !NET._ki) netSend({ t: 'mel', k: 1 }); NET._pu = pu; NET._ki = ki; }

  for (const pid in NET.peers) {

    for (let i = P.parked.length - 1; i >= 0; i--) { const q = P.parked[i]; q.t -= dt; if (q.t <= 0 || q.car.removed) { if (!q.car.removed) removeCar(q.car); P.parked.splice(i, 1); } }

    for (let i = 0; i < S.length - 1; i++) if (S[i].t <= rt && S[i + 1].t >= rt) { A = S[i]; B = S[i + 1]; break; }

    if (!ped || ped.removed) { ped = P.ped = makePed(B.x, B.z, 'player', { look: netLook(B.o), yaw: B.yaw }); ped.remote = P.pid; ped.persistent = true; ped.state = 'remote'; ped.money = 0; P.outfit = B.o; ped.y = B.y; }
    if (!GAME.peds.includes(ped)) GAME.peds.push(ped);
    ped.netName = P.name;
    if (P.outfit !== B.o) { P.outfit = B.o; ped.look = netLook(B.o); }
    ped.weapon = B.w; ped.hp = B.hp; ped.dead = !!(B.fl & 1); ped.swim = !!(B.fl & 4);
    const a = ped.anim; a.hands = (B.fl & 8) ? 1 : 0; a.swim = ped.swim ? 1 : 0;
    // the car
    if (B.c) {
      const ck = B.c; let c = P.car;
      if (c && (c.removed || c.rkey !== ck[0] || c.model !== ck[1])) { if (c.removed) P.car = null; else netParkCar(P); c = null; }
      if (!c) { const pi = P.parked.findIndex(q => q.car.rkey === ck[0] && q.car.model === ck[1] && !q.car.removed); if (pi >= 0) { c = P.car = P.parked[pi].car; P.parked.splice(pi, 1); } else c = P.car = netMakeCar(P, B); }
      if (!GAME.cars.includes(c)) GAME.cars.push(c);
      const ac = A.c && A.c[0] === ck[0] ? A.c : ck, kk = ac === ck ? 1 : k;
      const nx = lerp(num(ac[3]), num(ck[3]), kk), nz = lerp(num(ac[5]), num(ck[5]), kk);
      if (Math.hypot(nx - c.x, nz - c.z) > 30) { c.x = num(ck[3]); c.z = num(ck[5]); } else { c.x = nx; c.z = nz; }
      c.y = lerp(num(ac[4]), num(ck[4]), kk); c.yaw = lerpAng(num(ac[6]), num(ck[6]), kk); c.pitch = lerp(num(ac[7]), num(ck[7]), kk); c.roll = lerp(num(ac[8]), num(ck[8]), kk); c.bodyP = 0;
      c.steerA = num(ck[9]); c.speed = lerp(num(ac[10]), num(ck[10]), kk); c.vx = Math.sin(c.yaw) * c.speed; c.vz = Math.cos(c.yaw) * c.speed; c.w = 0;
      c.hp = num(ck[11], c.maxHp); const cf = ck[12] | 0; c.onFire = !!(cf & 2); c.siren = !!(cf & 4); c.braking = !!(cf & 8);
      if ((cf & 1) && !c.dead) { c.dead = true; c.onFire = false; c.burnT = 12; c.wreckT = 0; fxExplosion(c.x, c.y + .8, c.z, 1); sfxExplosion(c.x, c.z); }
      c.driver = ped; ped.car = c; ped.state = 'drive'; ped.rag = null; ped.x = c.x; ped.y = c.y; ped.z = c.z; ped.yaw = c.yaw; a.spd = 0;
      continue;
    }
    if (ped.car) { ped.car = null; netParkCar(P); }
    // on foot
    const nx = lerp(A.x, B.x, k), ny = lerp(A.y, B.y, k), nz = lerp(A.z, B.z, k), far = Math.hypot(nx - ped.x, nz - ped.z) > 12;
    const sp = far ? 0 : Math.hypot(nx - ped.x, nz - ped.z) / Math.max(dt, 1e-3);

    ped.yaw = far ? B.yaw : lerpAng(A.yaw, B.yaw, k);

      ped.rag.yaw = lerpAng(ar[0], B.r[0], k); ped.rag.ang = lerpAng(ar[1], B.r[1], k); ped.rag.roll = lerpAng(ar[2], B.r[2], k); }
    else { ped.state = 'remote'; ped.rag = null; }
    if (a.punch > 0) { a.punch += dt * 3.6; if (a.punch >= 1) a.punch = 0; }
    if (a.kick > 0) { a.kick += dt * 2.8; if (a.kick >= 1) a.kick = 0; }
    a.flinch = Math.max(0, a.flinch - dt * 4); a.recoil = Math.max(0, a.recoil - dt * 8);
  }
}
// remote cars: the owner drives them, here they only spin wheels and burn
function netCarTick(c, dt) {
  c.spin += c.speed * dt / c.def.wr;
  if (c.onFire && !c.dead) { fxFire(c.x + Math.sin(c.yaw) * c.def.L * .35, c.y + .9, c.z + Math.cos(c.yaw) * c.def.L * .35, .8); if (rnd() < .3) fxSmoke(c.x, c.y + 1.4, c.z, true); }
  else if (!c.dead && c.hp < c.maxHp * .3 && rnd() < .25) fxSmoke(c.x + Math.sin(c.yaw) * c.def.L * .4, c.y + 1, c.z + Math.cos(c.yaw) * c.def.L * .4, c.hp < c.maxHp * .15);
  if (c.dead && c.burnT > 0) { c.burnT -= dt; if (rnd() < .6) fxFire(c.x + rr(-1, 1), c.y + .8, c.z + rr(-1, 1), 1); }

// names over heads
const _ntv = [0, 0, 0];
function netTags(show) {

  for (const pid in NET.peers) { const P = NET.peers[pid];
    if (!P.tag) { P.tag = document.createElement('div'); P.tag.className = 'ntag o'; P.tag.innerHTML = '<span></span><s><i></i></s>'; box.appendChild(P.tag); }
    const e = P.tag, q = P.ped; let sc = null;
    if (show && q && !q.removed && !CAM.fp) { const x = q.car ? q.car.x : q.x, z = q.car ? q.car.z : q.z, y = q.car ? q.car.y + q.car.def.H + .55 : q.y + 2.1;
      if (d2(x, z, CAM.x, CAM.z) < 160 * 160) sc = worldToScreen(x, y, z, _ntv); }
    if (!sc) { if (e.style.display !== 'none') e.style.display = 'none'; continue; }
    e.style.display = 'block'; e.style.left = sc[0].toFixed(0) + 'px'; e.style.top = sc[1].toFixed(0) + 'px';
    const col = NET_COL[P.pid % NET_COL.length]; if (e._n !== P.name || e._c !== col) { e._n = P.name; e._c = col; e.firstChild.textContent = P.name; e.style.color = col; }
    const hp = Math.max(0, Math.round(q.hp)); if (e._hp !== hp) { e._hp = hp; e.lastChild.firstChild.style.width = Math.min(100, hp) + '%'; }
    e.style.opacity = sc[2] > 60 ? .55 : 1;
  }
}
function netBlips(blip) {
  if (!NET.on) return;

    blip(q.car ? q.car.x : q.x, q.car ? q.car.z : q.z, NET_COL[P.pid % NET_COL.length], 6, true, (P.name[0] || '?').toUpperCase()); }
}

// ---------- the online menu ----------
function netPlayerRows() {
  const rows = [[NET.me, NET.name + ' (you)']]; for (const pid in NET.peers) rows.push([+pid, NET.peers[pid].name + (NET.peers[pid].off ? ' · in menus' : '')]);
  rows.sort((a, b) => a[0] - b[0]); return rows;
}
function netFillList() {
  const L = $('nList'); if (!L) return; L.textContent = '';
  for (const [pid, nm] of netPlayerRows()) { const d = document.createElement('div'); d.className = 'np'; const i = document.createElement('i'); i.style.background = NET_COL[pid % NET_COL.length];
    const s = document.createElement('span'); s.textContent = nm + (pid === 0 ? ' · host' : ''); d.appendChild(i); d.appendChild(s); L.appendChild(d); }
}
let _netShape = '';
function netUI(force) {

}
MENU.online = function (from) {

    ${!NET.role ? `<div class="btns"><button class="mbtn primary" id="nHost">Host a game</button>
      <div class="row"><input id="nCode" class="ninput code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" autocapitalize="characters"><button class="mbtn" id="nJoin">Join with code</button></div></div>`

      ${inGame ? '<div id="nList"></div>' : ''}
      ${NET.role === 'host' ? `<div class="set">Players can hurt each other <div class="seg" id="nPvp"><button data-v="0" class="${NET.pvp ? '' : 'on'}">Off</button><button data-v="1" class="${NET.pvp ? 'on' : ''}">On</button></div></div>` : ''}
      <div class="btns">${NET.on ? `<button class="mbtn primary" id="nPlay">${GAME.running ? 'Resume' : '▶ Play'}</button>` : ''}<button class="mbtn" id="nLeave">${NET.on ? 'Leave online game' : 'Cancel'}</button></div>`}

addEventListener('pagehide', () => { if (NET.on) netSend({ t: 'bye' }); });
