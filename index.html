<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>Last Stand: The Dungeon of Vorak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{ --bg:#0a0710; --fg:#efeaff; --gold:#ffd23f; --red:#ff3b57; --dim:#8a80a8; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0a0710; } }
:root[data-theme="dark"]{ --bg:#0a0710; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:"Press Start 2P","Courier New",monospace;color:var(--fg)}
#wrap{position:fixed;inset:0;background:#0a0710}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#btnMute{position:absolute;right:8px;top:50px;z-index:8;width:34px;height:34px;
  background:rgba(14,10,26,.6);border:2px solid rgba(180,150,255,.4);color:#e8e0ff;
  font-family:"Press Start 2P",monospace;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#btnMute.off{color:#6f6790;border-color:rgba(120,100,160,.3)}
#btnMute.off:before{content:"";}
#callout{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:16px;color:#fff;
  text-shadow:0 3px 0 #000,0 0 16px #ff3b57;pointer-events:none;opacity:0;transition:opacity .15s;padding:0 12px}
#callout.show{opacity:1}

/* player HUD */
#hud{position:absolute;left:10px;top:10px;width:min(46%,220px);display:none}
#hud.on{display:block}
#hud .nm{font-size:8px;color:#fff;text-shadow:0 2px 0 #000;margin-bottom:5px}
.bar{height:13px;background:#150f20;border:2px solid #2d2340;position:relative}
.bar i{display:block;height:100%;transition:width .12s}
#hpfill{background:linear-gradient(180deg,#7bffd0,#17c08a 60%,#0a6b4c)}
#enfill{background:linear-gradient(180deg,#fff0a8,#ffc21f 60%,#a76f00)}
.bar.en{height:8px;margin-top:4px}
.bar.st{height:8px;margin-top:4px;display:none}
.bar.st.on{display:block}
#stfill{background:linear-gradient(180deg,#bfefff,#3fb6ff 60%,#12608f)}
#hptxt{position:absolute;right:3px;top:2px;font-size:7px;color:#fff;text-shadow:0 1px 0 #000}
#combo{position:absolute;left:0;top:64px;font-size:8px;color:var(--gold);text-shadow:0 2px 0 #000}

/* controls */
#ctl{position:absolute;inset:0;pointer-events:none;display:none;touch-action:none}
#ctl.on{display:block}
#stick{position:absolute;left:24px;bottom:26px;width:118px;height:118px;border-radius:50%;
  background:rgba(22,14,36,.42);border:3px solid rgba(180,150,255,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:rgba(206,190,255,.55);border:3px solid rgba(255,255,255,.55)}
#stick .lbl{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:6px;color:#9d94c4}
#btns{position:absolute;right:16px;bottom:18px;width:184px;height:184px;pointer-events:none}
.rb{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.3);color:#fff;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;pointer-events:auto;touch-action:none;padding:0;line-height:1}
.rb span{font-size:16px}
.rb canvas.ico{image-rendering:pixelated;display:block}
.rb em{font-style:normal;font-size:6px;opacity:.85}
.rb.hot{transform:scale(.93);filter:brightness(1.4)}
#bAtk{right:4px;bottom:58px;width:92px;height:92px;background:rgba(190,26,58,.62)}
#bAtk span{font-size:24px}
#bSpec{right:96px;bottom:6px;width:70px;height:70px;background:rgba(150,110,20,.62)}
#bSpec.off{opacity:.42}
#bJump{right:22px;bottom:2px;width:62px;height:62px;background:rgba(40,100,140,.6)}
#bBlock{right:96px;bottom:84px;width:62px;height:62px;background:rgba(60,50,110,.6)}
#bAbil{right:158px;bottom:44px;width:60px;height:60px;background:rgba(20,120,95,.62)}
#bAbil.off{opacity:.4}
#btns{width:232px}

/* screens */
.screen{position:absolute;inset:0;background:rgba(6,4,14,.93);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;line-height:1.8;
  overflow:auto;z-index:5}
.screen.hide{display:none}
.title{font-size:clamp(14px,5vw,22px);color:var(--gold);text-shadow:0 3px 0 #b3170f,0 0 18px rgba(255,59,87,.6)}
#scSelect,#scEnd{background:linear-gradient(180deg,rgba(42,35,72,.93) 0%,rgba(29,24,54,.80) 42%,
  rgba(16,12,32,.55) 70%,rgba(10,7,22,.88) 100%)}
#scSelect .sub{color:#d6ccff}
#cardinfo{color:#c3b9e8}
#scTitle{background:linear-gradient(180deg,rgba(6,4,14,.94) 0%,rgba(6,4,14,.8) 34%,rgba(8,4,16,.18) 60%,rgba(6,4,14,.72) 100%);
  justify-content:flex-start;padding-top:9vh;gap:0}
#scTitle .spacer{flex:1}
#logo{text-align:center;line-height:1}
#logo .l1,#logo .l2{font-size:clamp(26px,13vw,58px);letter-spacing:2px}
#logo .l1{color:#fff3c4;text-shadow:0 4px 0 #b3170f,0 8px 0 #4a0a12,0 0 26px rgba(255,90,60,.75)}
#logo .l2{color:#ffd23f;text-shadow:0 4px 0 #8b1020,0 9px 0 #3a0810,0 0 30px rgba(255,210,63,.8);
  margin-top:6px;animation:sheen 2.6s ease-in-out infinite}
#logo .l3{margin-top:14px;font-size:clamp(6px,2.3vw,9px);color:#c8b6ff;letter-spacing:1px;
  text-shadow:0 2px 0 #000;animation:fade 2.4s ease-in-out infinite}
@keyframes sheen{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pulse{animation:pulse 1.1s ease-in-out infinite;box-shadow:0 0 26px rgba(224,31,61,.55)}
.sub{font-size:8px;color:#b9aee0}
.blurb{font-size:8px;color:#8f86b5;max-width:40ch;line-height:2}
button{font-family:inherit;cursor:pointer;color:#fff;border:0}
.big{background:#e01f3d;padding:15px 22px;font-size:11px;border-bottom:4px solid #6d0a1e}
.big:active{transform:translateY(2px);border-bottom-width:2px}
.small{background:#2a2340;padding:9px 13px;font-size:8px;border-bottom:3px solid #14101f}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#roster{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:460px}
.card{background:#2b2348;border:2px solid #4a3f72;padding:5px 3px 6px;display:flex;flex-direction:column;
  align-items:center;gap:4px}
.card canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.card .nm{font-size:6px;color:#cfc5f0}
.card.sel{border-color:var(--gold);background:#3d3020}
#cardinfo{font-size:7px;color:#9b92c0;line-height:2;min-height:5em;max-width:42ch}
#cardinfo b{color:var(--gold);font-weight:400}
#crateScreen{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#2b1f4d 0%,#120c26 55%,#07040f 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px;z-index:12}
#crateScreen.on{display:flex}
.crateTitle{font-size:10px;color:#e0c9ff;letter-spacing:2px;text-shadow:0 2px 0 #000}
#reel{position:relative;width:100%;max-width:540px;height:112px;overflow:hidden;
  border:3px solid #6a5c9e;background:#18122c;box-shadow:0 0 30px rgba(120,80,220,.35)}
#strip{position:absolute;left:0;top:0;height:100%;display:flex;will-change:transform}
.tile{width:92px;flex:0 0 92px;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;border-right:2px solid #0a0710}
.tile canvas{width:36px;height:auto;image-rendering:pixelated;display:block}
.tile .tn{font-size:5px;line-height:1.3}
#marker{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#ffd23f;
  box-shadow:0 0 14px #ffd23f,0 0 28px #ff9a3a;z-index:3}
#marker:before,#marker:after{content:"";position:absolute;left:-6px;border:8px solid transparent}
#marker:before{top:-3px;border-top-color:#ffd23f}
#marker:after{bottom:-3px;border-bottom-color:#ffd23f}
#fade{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,#120c26 0%,rgba(18,12,38,0) 22%,rgba(18,12,38,0) 78%,#120c26 100%)}
#crateRes{font-size:9px;text-align:center;line-height:2.1;min-height:3.4em;color:#d6ccff;padding:0 10px}
#crateRes .big2{font-size:14px;letter-spacing:1px}
#reel.win{animation:reelwin .5s ease-out}
@keyframes reelwin{0%{box-shadow:0 0 60px #fff}100%{box-shadow:0 0 30px rgba(120,80,220,.35)}}
@media (max-height:560px){
  #reel{height:84px} .tile{width:70px;flex:0 0 70px} .tile canvas{width:28px}
  .crateTitle{font-size:8px} #crateRes{font-size:7px;min-height:2.6em}
}
#vsRow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#joinCode{font-family:inherit;font-size:11px;width:92px;padding:9px;background:#0e0a18;color:#ffd23f;
  border:2px solid #3a3160;text-align:center;text-transform:uppercase;letter-spacing:2px}
#codeBox{font-size:26px;color:#ffd23f;letter-spacing:8px;text-shadow:0 3px 0 #000;min-height:1.2em}
#vsBoard{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.vsCard{background:#2b2348;border:2px solid #4a3f72;padding:6px;min-width:92px;text-align:center}
.vsCard canvas{width:42px;height:auto;image-rendering:pixelated;display:block;margin:0 auto}
.vsCard .vn{font-size:6px;color:#efe9ff;margin-top:3px}
.vsCard .vs2{font-size:6px;margin-top:2px;color:#9b92c0}
.vsCard.rdy{border-color:#3fd16a}
.vsVs{font-size:12px;color:#ffd23f}
#vsStatus{color:#ffd23f}
.vsbtn{background:#1d5a6e;border-bottom:3px solid #0d2c38;color:#cfefff}
#shoprow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.boostbtn{background:#7a5a12;border-bottom:3px solid #3d2c06;color:#fff3c4}
.boostbtn.off{opacity:.45}
.cratebtn{background:#57277a;border-bottom:3px solid #2c1240;color:#f0d8ff}
#crateout{font-size:7px;line-height:1.8;min-height:1.6em;color:#d6ccff;text-align:center}
#crateout b{font-weight:400}
.card .rr{font-size:5px;letter-spacing:.5px}
.card{border-width:2px}
#cheatrow{display:flex;gap:6px;align-items:center}
#cheat{font-family:inherit;font-size:8px;width:88px;padding:8px;background:#0e0a18;color:#ffd23f;
  border:2px solid #3a3160;text-align:center}
#cash{font-size:10px;color:var(--gold);text-shadow:0 2px 0 #000}
#maps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mp{background:#453a70;border:2px solid #6a5c9e;color:#efe9ff;font-size:7px;padding:8px 10px;line-height:1.5}
.mp.sel{border-color:#ffd23f;background:#6b5520;color:#fff3c4}
.mp.lock{background:#332a55;color:#a196cc}
.mp.bs{background:#5a3552;border-color:#8a5580}
.mp.bs.sel{background:#7a2440;border-color:#ffd23f}

.card.lock canvas{filter:grayscale(1) brightness(.45)}
.card .pr{font-size:6px;color:var(--gold)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <button id="btnMute">♪</button>
  <div id="flash"></div>
  <div id="callout"></div>

  <div id="hud">
    <div class="nm" id="heroname">HERO</div>
    <div class="bar"><i id="hpfill" style="width:100%"></i><span id="hptxt">250 / 250</span></div>
    <div class="bar en"><i id="enfill" style="width:0%"></i></div>
    <div class="bar st" id="stbar"><i id="stfill" style="width:100%"></i></div>
    <div id="combo"></div>
  </div>

  <div id="ctl">
    <div id="stick"><div id="knob"></div><div class="lbl">MOVE · PUSH UP TO JUMP</div></div>
    <div id="btns">
      <button class="rb" id="bAbil" style="display:none"><span>✦</span><em id="abLbl">AEGIS</em></button>
      <button class="rb" id="bBlock"><span>🛡</span><em>BLOCK</em></button>
      <button class="rb" id="bJump"><span>▲</span><em id="jumpLbl">JUMP</em></button>
      <button class="rb" id="bSpec"><span>★</span><em id="spLbl">SUPER</em></button>
      <button class="rb" id="bAtk"><span>✊</span><em id="atkLbl">HIT</em></button>
    </div>
  </div>

  <div class="screen" id="scTitle">
    <div id="logo">
      <div class="l1">LAST</div><div class="l2">STAND</div>
      <div class="l3">◆ FOUR HEROES · ONE TITAN ◆</div>
    </div>
    <div class="spacer"></div>
    <button class="big pulse" id="btnStart">PRESS START</button>
  </div>

  <div class="screen hide" id="scSelect">
    <div class="sub" style="color:#ffd23f">Choose your hero</div>
    <div id="roster"></div>
    <div id="cardinfo"></div>
    <button class="small" id="btnBuy" style="display:none">Buy</button>
    <div id="shoprow">
      <button class="small boostbtn" id="btnBoost">BOOST</button>
      <button class="small cratebtn" id="btnCrate">CRATE · $500</button>
      <button class="small vsbtn" id="btnVs">ONLINE DUEL</button>
    </div>
    <div id="crateout"></div>
    <div id="cheatrow"><input id="cheat" type="text" inputmode="numeric" placeholder="code" maxlength="8"><button class="small" id="btnCheat">ENTER</button></div>
    <div class="sub" style="color:#c9bdf0">OPPONENT</div>
    <div id="bosses"></div>
    <div class="sub" style="color:#c9bdf0">ARENA</div>
    <div id="maps"></div>
    <div id="cash">$0</div>
    <button class="big" id="btnGo">Enter the arena</button>
  </div>

  <div class="screen hide" id="scVs">
    <div class="title" style="font-size:14px">ONLINE DUEL</div>
    <div id="vsStatus" class="sub">Pick host or join</div>
    <div id="codeBox"></div>
    <div id="vsBoard"></div>
    <div id="vsRow">
      <button class="small" id="btnHost">HOST GAME</button>
      <input id="joinCode" type="text" placeholder="CODE" maxlength="4" autocomplete="off"
        autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="small" id="btnJoin">JOIN</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="big" id="btnReady" style="display:none">READY</button>
      <button class="small" id="btnVsBack">BACK</button>
    </div>
    <div id="vsHint" class="blurb">Host a game, tell your friend the 4-letter code, and they join with it. Works anywhere you host this file yourself.</div>
  </div>

  <div id="crateScreen">
    <div class="crateTitle">OPENING CRATE</div>
    <div id="reel"><div id="strip"></div><div id="marker"></div><div id="fade"></div></div>
    <div id="crateRes">&nbsp;</div>
    <button class="big" id="btnClaim" style="display:none">CLAIM</button>
  </div>

  <div class="screen hide" id="scEnd">
    <div class="title" id="endTitle">VICTORY</div>
    <div class="sub" id="endLine"></div>
    <div class="blurb" id="endStat"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="big" id="btnAgain">Fight again</button>
      <button class="small" id="btnSwap">Change hero</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var CV=document.getElementById('cv'), G=CV.getContext('2d');
var WW=360, WH=560, GROUND=440, UNIT=1, WORLDW=860;
var FL=null;
function CC(c){ return FL||c; }
function px(x,y,w,h,c){ G.fillStyle=c; G.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function disc(cx,cy,r,col){ G.fillStyle=col;
  for(var y=-r;y<=r;y++){ var w=Math.floor(Math.sqrt(r*r-y*y));
    G.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1);} }
function stroke(x1,y1,x2,y2,w,col){
  var dx=x2-x1,dy=y2-y1,n=Math.max(1,Math.round(Math.max(Math.abs(dx),Math.abs(dy))));
  G.fillStyle=col; w=Math.max(1,Math.round(w)); var h=w/2;
  for(var i=0;i<=n;i++){ var t=i/n; G.fillRect(Math.round(x1+dx*t-h),Math.round(y1+dy*t-h),w,w); }
}
function limb(x1,y1,x2,y2,w,p,back){
  stroke(x1,y1,x2,y2,w+2,CC(p.o));
  stroke(x1,y1,x2,y2,w,CC(back?p.d:p.m));
  if(!back&&w>3) stroke(x1,y1,x2-1,y2,Math.max(2,w-3),CC(p.l));
}
function mlimb(x1,y1,x2,y2,wA,wB,bul,p,back){
  var dx=x2-x1,dy=y2-y1,n=Math.max(1,Math.round(Math.max(Math.abs(dx),Math.abs(dy))));
  var i,t,w;
  function prof(t){ return (wA+(wB-wA)*t)*(1+bul*Math.sin(Math.PI*t)); }
  G.fillStyle=CC(p.o);
  for(i=0;i<=n;i++){ t=i/n; w=Math.max(3,Math.round(prof(t))+2);
    G.fillRect(Math.round(x1+dx*t-w/2),Math.round(y1+dy*t-w/2),w,w); }
  G.fillStyle=CC(back?p.d:p.m);
  for(i=0;i<=n;i++){ t=i/n; w=Math.max(1,Math.round(prof(t)));
    G.fillRect(Math.round(x1+dx*t-w/2),Math.round(y1+dy*t-w/2),w,w); }
  if(!back){ G.fillStyle=CC(p.l);
    for(i=0;i<=n;i++){ t=i/n; w=Math.round(prof(t))-3;
      if(w>0) G.fillRect(Math.round(x1+dx*t-w/2-1),Math.round(y1+dy*t-w/2),w,w); } }
}
function oval(cx,cy,rx,ry,col){
  var rows=Math.max(2,Math.round(ry*2)+1);
  for(var i=0;i<rows;i++){
    var yy=-ry+i, frac=1-Math.pow(yy/ry,2); if(frac<0)frac=0;
    var ww=Math.max(1,Math.round(rx*2*Math.sqrt(frac)));
    px(cx-ww/2,cy+yy,ww,1,col);
  }
}
function pauldron(cx,cy,rx,ry,oCol,baseCol,hiCol,rimCol){
  oval(cx,cy,rx+1,ry+1,oCol);
  oval(cx,cy,rx,ry,baseCol);
  oval(cx,cy-ry*0.32,rx*0.74,ry*0.4,hiCol);
  px(Math.round(cx-rx*0.65),Math.round(cy+ry*0.45),Math.round(rx*1.3),1,rimCol);
}
function joint(x,y,a,len,dir){ return {x:x+Math.sin(a)*len*dir, y:y+Math.cos(a)*len}; }

/* bake heads */
function bake(map,key){
  var h=map.length,w=map[0].length;
  function mk(flip,white){
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var x=c.getContext('2d');
    for(var r=0;r<h;r++){ var row=map[r];
      for(var i=0;i<w;i++){ var ch=row.charAt(i); if(ch==="."||ch===""||ch===" ")continue;
        var col=white?(ch==="1"?"#8899aa":"#ffffff"):key[ch]; if(!col)continue;
        x.fillStyle=col; x.fillRect(flip?(w-1-i):i,r,1,1); } }
    return c;
  }
  return {w:w,h:h,r:mk(0,0),l:mk(1,0),rw:mk(0,1),lw:mk(1,1)};
}
var HEAD={}; for(var hk in HEADS) HEAD[hk]=bake(HEADS[hk],HK[hk]);
HEAD.titan=HEAD.vorak; HEAD.eater=HEAD.devourer; HEAD.warlock=HEAD.malvok; HEAD.machina=HEAD.omnis;
function mawTongue(cxh,topY,seed){
  var Wd=HEAD.maw.w, Hd=HEAD.maw.h;
  var jawX=cxh, jawY=topY+Hd-3;
  var sway=Math.sin(S.frames*0.1+seed)*4;
  var len=13+Math.sin(S.frames*0.14+seed)*5;
  var segs=7, px0=jawX, py0=jawY;
  for(var i=1;i<=segs;i++){
    var t=i/segs;
    var xx=jawX+sway*Math.sin(t*Math.PI*0.9);
    var yy=jawY+len*t;
    var ww=Math.max(2,Math.round(5-t*2.6));
    stroke(px0,py0,xx,yy,ww,"#8a1420");
    stroke(px0,py0,xx,yy,Math.max(1,ww-2),"#c62838");
    px0=xx; py0=yy;
  }
  disc(px0,py0,2.4,"#c62838"); disc(px0,py0,1.2,"#e8455a");
}
function head(id,cx,topY,dir){
  var s=HEAD[id], img=FL?(dir>0?s.rw:s.lw):(dir>0?s.r:s.l);
  G.drawImage(img,Math.round(cx-s.w/2),Math.round(topY));
}

function heroPose(f){
  var t=S.frames,st=f.st,c=f.c;
  var P={la:[0,0],lb:[0,0],aa:[0.25,0.15],ab:[-0.2,0.2],lean:0,bob:0,crouch:0};
  if(st==="walk"){ var w=Math.sin(t*0.24);
    P.la=[w*0.6,Math.max(0,-w)*0.7]; P.lb=[-w*0.6,Math.max(0,w)*0.7];
    P.aa=[-w*0.65+0.1,0.35]; P.ab=[w*0.65,0.35]; P.bob=Math.abs(w)>0.7?-1:0;
  } else if(st==="idle"||st==="block"){ P.bob=Math.round(Math.sin(t*0.07)); }
  if(f.z>0){ P.la=[0.5,0.55]; P.lb=[-0.35,0.9]; P.aa=[-0.7,0.4]; P.ab=[-1.0,0.5]; }
  if(f.flying){ P.la=[-0.95,0.2]; P.lb=[-1.3,0.28]; P.lean=2;
    if(st!=="attack"&&st!=="special"){ P.aa=[-0.45,0.15]; P.ab=[-0.85,0.2]; } }
  if(st==="attack"){
    var k=f.t,hf=c.hitFrame;
    if(f.id==="goliath"){
      if(k<hf){ P.aa=[-1.5,1.3]; P.ab=[0.4,0.3]; P.lean=-2; }
      else { P.aa=[1.5,0.02]; P.ab=[-0.5,0.5]; P.lean=3; }
    } else if(f.id==="nightclaw"){
      if(f.kick){
        if(k<hf){ P.la=[-0.7,1.2]; P.lean=-1; P.aa=[-0.6,0.5]; }
        else { P.la=[1.45,0.05]; P.lb=[-0.35,0.5]; P.lean=3; P.aa=[-0.9,0.4]; P.ab=[-1.2,0.4]; }
      } else {
        if(k<hf){ P.aa=[-1.5,0.9]; P.ab=[0.3,0.3]; P.lean=-2; }
        else { P.aa=[1.35,0.25]; P.ab=[0.9,0.3]; P.lean=3; }
      }
    } else if(f.id==="maw"){
      var cy=(f.cyc||0);
      if(k<hf){ P.aa=[-1.4+cy*0.2,1.0]; P.ab=[0.4,0.3]; P.lean=-2; }
      else if(cy===2){ P.aa=[1.2,0.5]; P.ab=[1.1,0.5]; P.lean=4; }
      else if(cy===1){ P.ab=[1.45,0.05]; P.aa=[-0.5,0.5]; P.lean=3; }
      else { P.aa=[1.45,0.05]; P.ab=[-0.5,0.5]; P.lean=3; }
    } else if(f.id==="eater"){
      if(k<hf){ P.la=[-0.85,0.9]; P.lean=-1; }
      else { P.la=[0.9,0.1]; P.lb=[-0.2,0.2]; P.lean=2; }
    } else if(f.id==="ironclad"){
      P.aa=[1.5,0.02]; P.ab=[-0.3,0.4]; P.lean=k<hf?0:1;
    } else {
      if(k<hf){ P.aa=[-0.9,1.1]; P.ab=[0.3,0.3]; P.lean=-1; }
      else { P.aa=[1.5,0.02]; P.ab=[-0.4,0.5]; P.lean=2; }
    }
  } else if(st==="special"){
    if(f.id==="ironclad"){ P.aa=[-1.15,0.35]; P.ab=[-1.35,0.4]; P.lean=-2; }
    else if(f.id==="vanguard"){ var u=Math.min(1,f.t/8); P.aa=[-0.8+u*2.4,0.1]; P.ab=[-0.3,0.4]; P.lean=1; }
    else if(f.id==="nightclaw"){ P.aa=[1.5,0.2]; P.ab=[1.35,0.25]; P.lean=3; P.la=[0.6,0.2]; }
    else if(f.id==="eater"){ P.aa=[1.45,0.05]; P.ab=[1.3,0.1]; P.lean=1; }
    else if(f.id==="maw"){ P.aa=[-1.9,0.4]; P.ab=[-2.1,0.4]; P.la=[0.7,0.5]; P.lb=[-0.6,0.8]; P.lean=2; }
    else { // flying kick
      P.aa=[-1.1,0.5]; P.ab=[-1.6,0.4];
      P.la=[1.45,0.05]; P.lb=[-0.5,1.1]; P.lean=2;
    }
  } else if(st==="hurt"){ P.lean=-3; P.aa=[-0.9,0.6]; P.ab=[-1.2,0.5]; P.la=[-0.3,0.2]; P.lb=[0.35,0.3]; }
  else if(st==="block"){ P.aa=[0.95,-1.45]; P.ab=[0.2,0.6]; P.lean=-1; P.crouch=1;
    P.la=[0.25,0.25]; P.lb=[-0.3,0.3]; }
  return P;
}

function drawTorso(f,shX,shY,hipX,hipY,dir,p,R,sc){
  var id=f.id, topW=(id==="goliath"?R.torsoW+7*sc:R.torsoW), botW=R.torsoW-(id==="goliath"?2*sc:4*sc);
  var n=Math.max(1,hipY-shY);

    px(x-1,y,ww+2,1,CC(p.o)); px(x,y,ww,1,CC(p.m));

  } else {

  if(muscle){

  } else {

  } else if(id==="vanguard"){

    px(shX+topW/2-5,shY+2,3,(hipY-shY)-2,CC(RS));
    px(shX-topW/2+2,shY+2,3,2,CC(RD)); px(shX+topW/2-5,shY+2,3,2,CC(RD));
    px(shX-topW/2+1,ey+11,topW-2,3,CC(RS));
    disc(ex,ey,6,CC(p.o)); disc(ex,ey,5,CC(RS)); disc(ex,ey,3,CC(p.a2)); disc(ex,ey,1,CC(RS));
  } else if(id==="warlock"){
    var rn2=hipY-shY;
    for(var ri2=2;ri2<rn2+8;ri2++){
      var rt2=ri2/(rn2+8), rw2=Math.round((topW-4)+((topW+10)-(topW-4))*rt2);
      px(shX-rw2/2,shY+ri2,rw2,1,CC("#2f5c30"));

    disc(ex-5*sc,ey,6*sc,CC(p.l)); disc(ex+5*sc,ey,6*sc,CC(p.l));
    disc(ex-5*sc,ey+1,5*sc,CC(p.m)); disc(ex+5*sc,ey+1,5*sc,CC(p.m));
    for(var ab2=0;ab2<3;ab2++) px(ex-6*sc,ey+7*sc+ab2*4*sc,13*sc,1,CC(p.d));
    px(ex-1,ey-4*sc,2,16*sc,CC(p.d));
    for(var wk2=0;wk2<4;wk2++){
      px(shX-topW/2+2+wk2*3,shY+5+wk2*7,7+((wk2*5)%6),2,CC("#f2f2ea"));
      px(shX+topW/2-8-wk2*3,shY+9+wk2*7,6,2,CC("#f2f2ea"));
    }
  } else if(id==="eater"){
    var EG="#e8558f", EGD="#a8215a";
    px(shX-topW/2+1,shY+2,topW-2,(hipY-shY)-2,CC(p.m));
    px(shX-topW/2+1,shY+2,topW-2,3,CC(p.l));
    px(shX-6*sc,shY+2,12*sc,(hipY-shY)-4,CC(EGD));
    px(shX-4*sc,shY+4,8*sc,(hipY-shY)-8,CC(EG));
    px(shX-topW/2+1,shY+2,4*sc,(hipY-shY)-2,CC(EGD));
    px(shX+topW/2-4*sc-1,shY+2,4*sc,(hipY-shY)-2,CC(EGD));
    px(hipX-botW/2-3,hipY-6*sc,botW+6,5*sc,CC(EGD));
    px(hipX-botW/2-3,hipY-6*sc,botW+6,2,CC(EG));
  } else if(id==="weaver"){
    var WL=CC(p.d), hgt=hipY-shY;
    for(var wv=0;wv<4;wv++) px(shX-topW/2+2+wv*4,shY+2,1,hgt-2,WL);

    px(ex-4,ey-1,9,1,WL); px(ex-3,ey+2,7,1,WL);

  } else {

    px(shX-5*s2,shY+1,11*s2,3*s2,CC(p.l));

      disc(hand.x+dir*4,hand.y,3,"#f2f6ff");

function bossTorso(shX,shY,hipX,hipY,dir,p,b){

    oval(shX-10,shY+11,9,5,CC(p.m)); oval(shX+10,shY+11,9,5,CC(p.m));
    for(var sr=22;sr<sn-6;sr+=7){ px(shX-12,shY+sr,25,2,CC(p.d)); px(shX-1,shY+sr-4,2,5,CC(p.d)); }
    for(var wk=0;wk<5;wk++){

function updHero(){

      h.en-=c.spCost; callout(c.sp,800); SFX.zap(); }
  }

  if(h.abilCd>0)h.abilCd--;
  if(h.buff>0)h.buff--;

    if(h.stam===undefined) h.stam=c.stam;
    var ceil=Math.min(150,GROUND-64);
    var thrusting = IN.hold && h.stam>0 && h.z>1 && h.z<ceil && h.st!=="hurt" && h.st!=="ko";
    if(thrusting){

    } else { h.flying=false; }
    h.stam=Math.max(0,Math.min(c.stam, h.stam+(h.z<=0?0.8:0.1)));
  }

  if(h.st==="attack"){
    if(h.t===c.hitFrame){
      if(c.ranged){
        S.shots.push({x:h.x+h.dir*16*sc,y:h.fy-38*sc,vx:h.dir*(c.shot==="web"?8:7),
          kind:(c.shot==="cannonH"?"plasma":(c.shot||"plasma")),dmg:c.light,life:120});
        SFX.zap(); shake(2);

        hitSentries(h.x+h.dir*c.lightRange*0.7,c.lightRange*0.6,c.light);
        var dmgL=c.light+(S.combo>=6?4:0);
        if(h.id==="nightclaw"&&h.kick) dmgL+=5;
        if(h.id==="maw"&&h.cyc===2) dmgL+=8;
        if(inX&&h.z<tgtTop()-12&&b.hp>0) damageBoss(dmgL,(h.id==="nightclaw"&&h.kick)?1.8:1);
        else spark(h.x+h.dir*28*sc,h.fy-34*sc,4,"#6a5c99",2.5,1.8);
      }
    }
    if(h.t>c.hitFrame+10){h.st="idle";h.t=0;}
  }
  if(h.st==="special") runSpecial(h);

  h.vz-=0.33; h.z+=h.vz; if(h.z<=0){h.z=0;h.vz=0;}
  if(h.knock){ h.x+=h.knock; h.knock*=.86; if(Math.abs(h.knock)<.15)h.knock=0; }
  h.x=Math.max(18,Math.min(WORLDW-18,h.x));

  if(b2&&b2.hp>0&&h.z<70&&h.st!=="special"){

    if(Math.abs(gap)<sep) h.x=b2.x+(gap>=0?sep:-sep);
    h.x=Math.max(18,Math.min(WORLDW-18,h.x));
  }
  h.fy=GROUND-h.z;
  if(S.map==="wasteland"&&h.hp>0&&h.z<24&&(h.x<36||h.x>WORLDW-36)){
    h.burn=(h.burn||0)+1;

      beep(240,.08,"sawtooth",.05,120);
      if(h.hp<=0){ h.hp=0; h.st="ko"; if(S.mode==="pvp") endDuel(false); else endGame(false); }
    }
  } else h.burn=0;

function updBoss(){
  var b=S.boss,h=S.hero; if(!b||!h) return;
  if(b.flash>0)b.flash--;
  if(b.chip>Math.max(0,b.hp)/b.maxhp) b.chip-=0.004;
  if(b.hp<=0)return;
  var slowed=(b.slow>0);
  if(slowed) b.slow--;
  if(b.dot&&b.dot.left>0){
    b.dot.t--;
    if(b.dot.t<=0){ b.dot.t=b.dot.every; b.dot.left--;
      b.hp-=b.dot.dmg; S.dealt+=b.dot.dmg; b.flash=4;
      popNum(b.x+(Math.random()*20-10),b.fy-76,b.dot.dmg,"#d8f8ff");
      if(b.hp<=0){ b.hp=0; endGame(true); return; } }
  }
  var rate=slowed?0.45:1;
  b.t+=rate;
  if((b.def||BOSSDEF.vorak).sentry){
    b.sentryT-=rate;
    if(b.sentryT<=0){ b.sentryT=3600; spawnSentries(); }
  }
  if(h.hp<=0){ b.st="idle"; return; }
  b.dir=(h.x>=b.x)?1:-1;
  var dist=Math.abs(h.x-b.x);
  if(b.st==="idle"||b.st==="walk"){
    if(b.cd>0){ b.cd-=rate;
      if(dist>70){ b.x+=b.dir*1.05*rate; b.st="walk"; b.walkT+=rate; }
      else if(dist<42){ b.x-=b.dir*0.8*rate; b.st="walk"; b.walkT+=rate; }
      else b.st="idle";
    } else {
      var kind;
      var stl=(b.def||BOSSDEF.vorak).style;
      if(stl==="sorcerer") kind=(dist<70&&Math.random()<0.5)?"punch":"bolt";
      else if(stl==="machine") kind=(Math.random()<0.62)?"cannon":"beam";
      else if(stl==="eater") kind=(Math.random()<0.5)?"stomp":"pbeam";
      else if(stl==="symbiote"){
        var rr2=Math.random();
        kind=(dist<74)?(rr2<0.55?"combo":"dive"):(rr2<0.6?"tendril":"dive");
      }
      else kind=(dist<78)?(Math.random()<0.55?"punch":"slam"):"slam";
      b.tel={kind:kind,len:(kind==="punch"?30:kind==="bolt"?44:kind==="cannon"?26:
        kind==="stomp"?40:kind==="pbeam"?46:kind==="tendril"?30:kind==="combo"?24:
        kind==="dive"?34:38),mark:h.x};
      b.st="tel"; b.t=0; SFX.warn();
      teach(kind, kind==="tendril"?"TENDRILS — JUMP OR DUCK BETWEEN THEM"
        :kind==="dive"?"HE DIVES AND DRAGS YOU IN — RUN WIDE"
        :kind==="combo"?"THREE-HIT COMBO — BLOCK OR BACK OFF"
        :kind==="stomp"?"HE STOMPS WHERE YOU STAND — MOVE!"
        :kind==="pbeam"?"PURPLE BEAM — BLOCK OR DUCK OUT OF THE LINE"
        :kind==="cannon"?"JUMP OR BLOCK THE CANNONS"
        :kind==="beam"?"CHEST BEAM — BLOCK OR GET OUT OF THE LINE"
        :kind==="punch"?"RED — JUMP OR BLOCK THE PUNCH"
        :(kind==="bolt"?"GREEN — RUN! BLOCKING WON'T SAVE YOU":"ORANGE — JUMP THE SLAM"));
    }
  } else if(b.st==="tel"){
    if(b.t>=b.tel.len){ b.st="act"; b.t=0; fireAttack(b.tel.kind); }
  } else if(b.st==="act"){
    if(b.t>26){ b.st="idle"; b.tel=null; b.t=0; b.cd=64+(Math.random()*40|0); }
  }
  if(b.knock){ b.x+=b.knock; b.knock*=.84; if(Math.abs(b.knock)<.15)b.knock=0; }
  b.x=Math.max(40,Math.min(WORLDW-40,b.x));
  b.fy=GROUND-(b.z||0);
}

  if(kind==="cannon"){
    SFX.zap(); shake(3);
    for(var cq=0;cq<2;cq++)
      S.shots.push({x:b.x+b.dir*24,y:b.fy-52-cq*16,vx:b.dir*5.6,kind:"cannon",dmg:def.cannon,life:160});
    spark(b.x+b.dir*30,b.fy-56,8,"#ff6a6a",4,2);

    SFX.big(); shake(11); flashScreen(.45);
    S.beams.push({x:b.x+b.dir*20,dir:b.dir,life:30,y:b.fy-BRIG.sh+15,evil:true,red:true});
    if(h.z<58&&((b.dir>0&&h.x>b.x)||(b.dir<0&&h.x<b.x))) damageHero(def.beam,3.6);
    return;
  }
  if(kind==="punch"){
    SFX.big(); shake(6);
    var reach=b.x+b.dir*64;
    var inX=(b.dir>0)?(h.x+12>=b.x&&h.x-12<=reach):(h.x-12<=b.x&&h.x+12>=reach);
    if(inX&&h.z<30) damageHero(def.punch,3.2);
    spark(b.x+b.dir*48,b.fy-44,10,"#d8b6f0",6,3);
  } else {
    SFX.big(); shake(13); flashScreen(.35);
    ring(b.x,GROUND,"#c66cff");
    S.shots.push({x:b.x,y:GROUND-10,vx:-4.6,kind:"wave",life:140});
    S.shots.push({x:b.x,y:GROUND-10,vx:4.6,kind:"wave",life:140});
    spark(b.x,GROUND-4,22,"#c66cff",9,4);
    if(Math.abs(h.x-b.x)<52&&h.z<14) damageHero(def.slam,7);
  }
}

function hitSentries(x,rad,dmg){
  var got=false;

  for(var i=S.sentries.length-1;i>=0;i--){
    var s=S.sentries[i];
    if(Math.abs(s.x-x)<rad){
      s.hp-=dmg; s.flash=8; got=true;
      popNum(s.x,s.y-14,dmg,"#cfe4ff"); spark(s.x,s.y,5,"#9fd8ff",3,2);
      if(s.hp<=0){ S.sentries.splice(i,1); spark(s.x,s.y,14,"#ff8a2b",6,3); ring(s.x,s.y,"#ff8a2b");
        SFX.big(); S.hero.en=Math.min(100,S.hero.en+10); }
    }
  }
  return got;
}
function updSentries(){
  var h=S.hero; if(!h) return;

function updShots(){
  var h=S.hero,b=TGT()||{x:-9999,fy:GROUND,hp:0},TWb=tgtHalf(),THb=tgtTop();
  for(var i=S.shots.length-1;i>=0;i--){
    var s=S.shots[i]; s.x+=s.vx; s.life--;
    if(s.kind==="shield"){
      hitSentries(s.x,20,h.c.spDmg);
      if(b.hp>0&&Math.abs(s.x-b.x)<TWb+4&&s.hits<3){ s.hits++; damageBoss(h.c.spDmg,.6);
        s.vx*=-1; s.x+=s.vx*4; if(s.hits>=3){S.shots.splice(i,1);continue;} }
      if(s.x<12||s.x>WORLDW-12) s.vx*=-1;
    } else if(s.kind==="plasma"){
      if(hitSentries(s.x,20,s.dmg)){ S.shots.splice(i,1); continue; }
      if(b.hp>0&&Math.abs(s.x-b.x)<TWb+2&&s.y>b.fy-THb&&s.y<b.fy){
        damageBoss(s.dmg+(S.combo>=6?4:0),.8); S.shots.splice(i,1); continue; }
    } else if(s.kind==="hammer"){
      if(hitSentries(s.x,22,s.dmg)) s.ret=true;
      if(b.hp>0&&Math.abs(s.x-b.x)<TWb+4&&s.hits<2){
        s.hits++; damageBoss(s.dmg,2); s.ret=true; }
      if(!s.ret&&Math.abs(s.x-s.home)>150) s.ret=true;
      if(s.ret){ var back=(h.x-s.x); s.vx=(back>0?1:-1)*7.2;
        if(Math.abs(back)<14){ S.shots.splice(i,1); continue; } }
      s.spin=(s.spin||0)+0.5;
    } else if(s.kind==="quake"){
      if(b.hp>0&&Math.abs(s.x-b.x)<TWb+4){ damageBoss(s.dmg,1.5); S.shots.splice(i,1); continue; }
    } else if(s.kind==="web"||s.kind==="webbig"){
      if(hitSentries(s.x,20,s.dmg)){ S.shots.splice(i,1); continue; }
      if(b.hp>0&&Math.abs(s.x-b.x)<TWb+4&&s.y>b.fy-THb&&s.y<b.fy){
        var big=(s.kind==="webbig");
        damageBoss(s.dmg,big?2:.4,{slow:big?260:150,dot:{n:big?8:6,d:big?6:4}});
        if(S.mode!=="pvp") webStick(big?260:150, big?8:6, big?6:4);
        for(var q=0;q<(big?14:6);q++) spark(b.x+(Math.random()*30-15),b.fy-50-Math.random()*40,1,"#f2f2ff",3,1.5);
        S.shots.splice(i,1); continue; }
    } else {
      if(s.kind==="tendril"){
        s.y+=Math.sin((s.life+s.wob*9)*0.25)*1.2;
        if(Math.abs(s.x-h.x)<15&&s.y>h.fy-54&&s.y<h.fy-2&&h.hp>0){
          damageHero(s.dmg,2.4); if(s.crit) callout("CRITICAL!",700);
          S.shots.splice(i,1); continue; }
        if(s.life<=0||s.x<-20||s.x>WORLDW+20) S.shots.splice(i,1);
        continue;
      }
      if(s.kind==="sbolt"){
        if(Math.abs(s.x-h.x)<14&&Math.abs(s.y-(h.fy-26))<26&&h.hp>0){
          damageHero(s.dmg,1.2); S.shots.splice(i,1); continue; }
        if(s.life<=0||s.x<-20||s.x>WORLDW+20) S.shots.splice(i,1);
        continue;
      }
      var hit=Math.abs(s.x-h.x)<16&&h.z<18;
      if(hit&&h.hp>0){ damageHero(((S.boss&&S.boss.def)||BOSSDEF.vorak).wave||18,4.5); S.shots.splice(i,1); continue; }
    }
    if(s.life<=0||s.x<-20||s.x>WORLDW+20) S.shots.splice(i,1);
  }
  for(var j=S.beams.length-1;j>=0;j--) if(--S.beams[j].life<=0) S.beams.splice(j,1);
}

/* ================= peerjs netplay ================= */
/* STUN finds your public address; TURN relays the traffic when the two
   networks refuse a direct link (mobile carrier CGNAT, strict office wifi).
   Without TURN the data channel silently never opens. */
var ICE={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
]};
/* Signalling servers, tried in order. The public PeerJS cloud goes down
   often — when it does, every duel fails with "network". To fix that for
   good, run your own peerjs-server and uncomment the second entry. */
var BROKERS=[
  {},  // default: 0.peerjs.com (free, public, unreliable)
  {host:"marvel-s.onrender.com", port:443, secure:true, path:"/"}
];
function peerOpts(i){
  var b=BROKERS[i]||{}, o={debug:0,config:ICE};
  for(var k in b) o[k]=b[k];
  return o;
}
function isBrokerErr(t){
  return t==="network"||t==="server-error"||t==="socket-error"||t==="socket-closed";
}
/* rotate through the brokers, then start again after a pause */
function brokerRetry(label,again){
  NET.bi=(NET.bi||0)+1;
  if(NET.bi<BROKERS.length){
    vsLog(label+": trying another server…");
    setTimeout(again,400); return;
  }
  NET.bi=0; NET.tries=(NET.tries||0)+1;
  if(NET.tries>2){
    vsLog("Signalling server is down — duels can't connect right now");
    updateVsUI(); return;
  }
  vsLog(label+": server busy, retrying…");
  setTimeout(again,1500*NET.tries);
}
var NET={peer:null,conn:null,role:null,code:null,open:false,codeLive:false,
  joinTimer:null,bi:0,tries:0,ready:false,foeReady:false,
  foeHero:"ironclad",foeBoost:0,err:null};
function vsLog(msg){ var el=document.getElementById('vsStatus'); if(el) el.textContent=msg; }
function makeCode(){
  var A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s="";
  for(var i=0;i<4;i++) s+=A.charAt(Math.floor(Math.random()*A.length));
  return s;
}
function peerId(code){ return "laststand-v1-"+code; }
function netAvailable(){ return (typeof Peer!=="undefined"); }
function netSend(o){ try{ if(NET.conn&&NET.conn.open) NET.conn.send(o); }catch(e){} }
function bindConn(c){
  NET.conn=c;
  c.on('open',function(){
    NET.open=true; NET.tries=0; clearTimeout(NET.joinTimer);
    netSend({t:'hello',hero:S.pick,bs:(BOOST[S.pick]||0)});
    vsLog("Connected! Both press READY");
    updateVsUI();
  });
  c.on('data',function(d){ onNetData(d); });
  c.on('close',function(){ NET.open=false; NET.foeReady=false;
    vsLog("Opponent disconnected");
    if(S.scene==="fight"&&S.mode==="pvp") endDuel(true,"opponent left");
    updateVsUI(); });
  c.on('error',function(e){ vsLog("Connection error"+(e&&e.type?" ("+e.type+")":"")); });
}
function hostGame(keepCode){
  if(!netAvailable()){ vsLog("Multiplayer unavailable here"); return; }
  cleanupNet();
  NET.role="host";
  if(!keepCode||!NET.code) NET.code=makeCode();
  if(!keepCode){ NET.bi=0; NET.tries=0; }
  vsLog("Starting host…");
  try{
    NET.peer=new Peer(peerId(NET.code),peerOpts(NET.bi));
  }catch(e){ vsLog("Could not start host"); return; }
  NET.peer.on('open',function(){
    NET.codeLive=true; NET.tries=0;
    vsLog("Waiting for a friend to join…");
    updateVsUI();
  });
  NET.peer.on('connection',function(c){ bindConn(c); });
  NET.peer.on('error',function(e){
    var t=(e&&e.type)||"error";
    if(t==="unavailable-id"){ NET.code=makeCode(); vsLog("Retrying…");
      cleanupNet(); setTimeout(function(){ hostGame(true); },300); }
    else if(isBrokerErr(t)) brokerRetry("Host",function(){ hostGame(true); });
    else vsLog("Host failed ("+t+")");
    updateVsUI();
  });
  updateVsUI();
}
function joinGame(code,retrying){
  if(!netAvailable()){ vsLog("Multiplayer unavailable here"); return; }
  code=(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==4){ vsLog("Enter the 4-character code"); return; }
  cleanupNet();
  NET.role="guest"; NET.code=code;
  if(!retrying){ NET.bi=0; NET.tries=0; }
  vsLog("Connecting to "+code+"…");
  try{ NET.peer=new Peer(peerOpts(NET.bi)); }catch(e){ vsLog("Could not connect"); return; }
  NET.peer.on('open',function(){
    var c=NET.peer.connect(peerId(code),{reliable:true});
    if(!c){ vsLog("No game with that code"); return; }
    bindConn(c);
    clearTimeout(NET.joinTimer);
    NET.joinTimer=setTimeout(function(){
      if(NET.open) return;
      vsLog("Still negotiating…");
      NET.joinTimer=setTimeout(function(){
        if(!NET.open) vsLog("Couldn't connect — check the code, or one of you is on a network blocking WebRTC");
      },14000);
    },8000);
  });
  NET.peer.on('error',function(e){
    var t=(e&&e.type)||"error";
    if(t==="peer-unavailable"){ vsLog("No game with that code — is your friend still hosting?"); }
    else if(isBrokerErr(t)){ brokerRetry("Join",function(){ joinGame(code,true); }); return; }
    else vsLog("Connect failed ("+t+")");
    updateVsUI();
  });
  updateVsUI();
}
function cleanupNet(){
  try{ if(NET.conn) NET.conn.close(); }catch(e){}
  try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  clearTimeout(NET.joinTimer); NET.joinTimer=null;
  NET.peer=null; NET.conn=null; NET.open=false; NET.codeLive=false;
  NET.ready=false; NET.foeReady=false;
}
function onNetData(d){
  if(!d||!d.t) return;
  if(d.t==='hello'){ NET.foeHero=CHARS[d.hero]?d.hero:"ironclad"; NET.foeBoost=+d.bs||0;
    netSend({t:'hello2',hero:S.pick,bs:(BOOST[S.pick]||0)}); updateVsUI(); }
  else if(d.t==='hello2'){ NET.foeHero=CHARS[d.hero]?d.hero:"ironclad"; NET.foeBoost=+d.bs||0; updateVsUI(); }
  else if(d.t==='ready'){ NET.foeReady=!!d.v; updateVsUI(); tryStartDuel(); }
  else if(d.t==='start'){ beginDuel(d.map); }
  else if(d.t==='s'){
    if(!S.foe) return;
    S.foe.tx=+d.x; S.foe.z=+d.z||0; S.foe.st=d.st||"idle"; S.foe.dir=+d.d||-1;
    S.foe.hp=+d.hp; S.foe.maxhp=+d.mhp||S.foe.maxhp;
    S.foe.buff=d.bf?60:0;
    if(d.dead&&S.scene==="fight"&&S.hero&&S.hero.hp>0) endDuel(true);
  }
  else if(d.t==='hit'){
    if(S.mode!=="pvp"||S.scene!=="fight"||!S.hero) return;
    damageHero(Math.max(1,Math.min(400,Math.round(+d.dmg||0))),+d.knock||2,!!d.unb);
    if(d.slow) S.hero.netSlow=Math.max(S.hero.netSlow||0,Math.min(300,+d.slow));
    if(d.dot) S.hero.netDot={left:Math.min(10,+d.dot.n||0),every:24,t:24,dmg:Math.min(20,+d.dot.d||0)};
  }
  else if(d.t==='rematch'){ if(S.scene==="end"){ NET.ready=false; NET.foeReady=false; setScene("vs"); } }
}
function pvpDamage(amount,knock,extra){
  if(!S.hero) return;
  var a=Math.round(amount*(S.hero.atkMul||1));
  var msg={t:'hit',dmg:a,knock:knock||2};
  if(extra&&extra.slow) msg.slow=extra.slow;
  if(extra&&extra.dot) msg.dot=extra.dot;
  netSend(msg);
  S.combo++; S.comboT=100; S.hero.en=Math.min(100,S.hero.en+7);
  if(S.foe){ S.foe.flash=10;
    popNum(S.foe.x+(Math.random()*18-9),S.foe.fy-56,a,"#ffd23f");
    spark(S.foe.x,S.foe.fy-30,7,"#ffd23f",5,3); }

}
function makeFoe(){

function render(){
  G.save();

  G.translate(-Math.round(S.scene==="fight"?(S.cam||0):0),0);
  drawBG();

  if(S.scene==="select") previewStage();
  if(S.mode==="pvp"&&S.foe&&S.scene==="fight"){ drawHero(S.foe); foeBar(S.foe); }
  else if(S.boss&&S.scene!=="title") drawBoss(S.boss);
  if(S.scene==="fight"&&S.mode!=="pvp") drawSentries();
  if(S.hero&&S.scene!=="title") drawHero(S.hero);
  drawFx();

}
var last=0,acc=0;
function loop(ts){ requestAnimationFrame(loop);
  if(!last)last=ts;
  var dt=Math.min(90,ts-last); last=ts; acc+=dt;
  var guard=0;
  while(acc>=16.667&&guard<5){ if(S.scene==="fight")step(); else S.frames++; acc-=16.667; guard++; }
  if(acc>60)acc=0;
  render();
  if(S.scene==="fight") syncHUD();
}

  S.scene="end";
  var secs=Math.round((Date.now()-S.startTime)/1000), best="";
  document.getElementById('endTitle').textContent=won?"VORAK FALLS":"YOU FALL";
  document.getElementById('endTitle').style.color=won?"#7bffd0":"#ff6b7d";
  document.getElementById('endLine').textContent=won?S.hero.c.name+" is still standing."
    :"Vorak steps over "+S.hero.c.name+" and walks up the stairs.";
  try{ if(won){ var key="lastst2.best."+S.hero.id, prev=localStorage.getItem(key);
    if(!prev||secs<parseInt(prev,10)){ localStorage.setItem(key,String(secs)); best=" · new best!"; }
    else best=" · best "+prev+"s"; } }catch(e){}
  if(won){ CASH+=100; saveAll(); }
  document.getElementById('endStat').textContent=won
    ?"Cleared in "+secs+"s with "+Math.max(0,Math.round(S.hero.hp))+" HP left"+best
      +"  ·  +$100  (you have $"+CASH+")"
    :"Vorak had "+Math.round(S.boss.hp)+" HP left. You dealt "+S.dealt+". No payout.";
  updateShop();
  setTimeout(function(){setScene("end");},900);
  setTimeout(startTune,1400);
  if(won){ SFX.win(); flashScreen(.8); shake(12); ring(S.boss.x,S.boss.fy-40,"#fff"); } else SFX.lose(); }

function portrait(cvs,id){
  var real=G, rg=GROUND, rw=WW;
  G=cvs.getContext('2d'); G.imageSmoothingEnabled=false;
  px(0,0,cvs.width,cvs.height,"#4a4270");
  px(0,0,cvs.width,Math.round(cvs.height*0.55),"#5b5288");
  px(0,74,cvs.width,10,"#39325c"); px(0,74,cvs.width,2,"#6a5f9c");
  GROUND=78; WW=cvs.width;
  drawHero({id:id,c:CHARS[id],pal:CHARS[id].pal,R:rigFor(CHARS[id].sc,CHARS[id].bulk),
    x:29,z:0,fy:78,dir:1,st:"idle",t:0,flash:0});
  GROUND=rg; WW=rw; G=real;
}
function lockOverlay(cvs){
  var x=cvs.getContext('2d'); x.imageSmoothingEnabled=false;
  x.fillStyle="rgba(6,4,14,.55)"; x.fillRect(0,0,cvs.width,cvs.height);
  var lx=Math.round(cvs.width/2)-6, ly=Math.round(cvs.height/2)-8;
  x.fillStyle="#0a0710"; x.fillRect(lx-1,ly+4,14,13);
  x.fillStyle="#ffd23f"; x.fillRect(lx,ly+5,12,11);
  x.fillStyle="#0a0710"; x.fillRect(lx+5,ly+8,2,5);
  x.fillStyle="#ffd23f"; x.fillRect(lx+2,ly,8,3); x.fillRect(lx+2,ly,2,6); x.fillRect(lx+8,ly,2,6);
}

    host[i].classList.toggle('lock',isLocked(id));
    if(!host[i].classList.contains('sel')) host[i].style.borderColor=RARITY[CHARS[id].rar].col;
    var bs=Math.min(MAXBOOST,BOOST[id]||0);
    var rr=document.getElementById('rr_'+id);

function boostPriceFor(id){
  var c=CHARS[id], bs=Math.min(MAXBOOST,BOOST[id]||0);
  return Math.round(c.boostPrice*(1+0.75*bs));
}
function applyBoost(id,quiet){
  BOOST[id]=Math.min(MAXBOOST,(BOOST[id]||0)+1);
  saveAll(); refreshCards(); updateShop(); S.pv=null;
  if(!quiet){ callout(CHARS[id].name+" BOOST ×"+BOOST[id],1300);
    beep(660,.1,"square",.07); setTimeout(function(){beep(990,.18,"square",.07);},110); }
}
function buyBoost(){
  var id=S.pick, bs=Math.min(MAXBOOST,BOOST[id]||0);
  if(bs>=MAXBOOST){ callout("BOOST MAXED",900); return; }
  var cost=boostPriceFor(id);
  if(CASH<cost){ callout("NEED $"+(cost-CASH)+" MORE",1100); beep(150,.2,"square",.05); return; }
  CASH-=cost; applyBoost(id);
}
function crateRoll(){
  var pool=[],tot=0,i;
  for(i=0;i<ORDER.length;i++){
    var id=ORDER[i], w=RARITY[CHARS[id].rar].weight;
    if((BOOST[id]||0)>=MAXBOOST) w=Math.round(w*0.25);
    pool.push({id:id,w:w}); tot+=w;
  }
  var r=Math.random()*tot;
  for(i=0;i<pool.length;i++){ r-=pool[i].w; if(r<=0) return pool[i].id; }
  return pool[0].id;
}
var TILEW=92, WINDEX=41, TILES=48, spinning=false;
function randomTileId(){
  var tot=0,i,w=[];
  for(i=0;i<ORDER.length;i++){ var ww=RARITY[CHARS[ORDER[i]].rar].weight; w.push(ww); tot+=ww; }
  var r=Math.random()*tot;
  for(i=0;i<ORDER.length;i++){ r-=w[i]; if(r<=0) return ORDER[i]; }
  return ORDER[0];
}
function tileW(){ return (window.innerHeight&&window.innerHeight<=560)?70:TILEW; }
function openCrate(){
  if(spinning) return;
  if(CASH<CRATE_COST){ callout("NEED $"+(CRATE_COST-CASH)+" MORE",1100); beep(150,.2,"square",.05); return; }
  CASH-=CRATE_COST; saveAll(); updateShop();
  spinCrate(crateRoll());
}
function spinCrate(winId){
  spinning=true;
  var scr=document.getElementById('crateScreen'), strip=document.getElementById('strip'),
      res=document.getElementById('crateRes'), claim=document.getElementById('btnClaim'),
      reel=document.getElementById('reel');
  strip.innerHTML=''; res.innerHTML='&nbsp;'; claim.style.display='none';
  strip.style.transform='translateX(0px)';
  reel.classList.remove('win');
  var TW=tileW();
  for(var i=0;i<TILES;i++){
    var id=(i===WINDEX)?winId:randomTileId();
    var c=CHARS[id], r=RARITY[c.rar];
    var tile=document.createElement('div'); tile.className='tile';
    tile.style.background='linear-gradient(180deg,rgba(0,0,0,.2),'+r.col+'55)';
    tile.style.width=TW+'px'; tile.style.flex='0 0 '+TW+'px';
    var cv=document.createElement('canvas'); cv.width=58; cv.height=84;
    tile.appendChild(cv);
    var nm=document.createElement('div'); nm.className='tn'; nm.style.color=r.col;
    nm.textContent=c.name; tile.appendChild(nm);
    strip.appendChild(tile);
    portrait(cv,id);
  }
  scr.classList.add('on');
  stopTune();
  var cw=reel.offsetWidth||320;
  var jitter=(Math.random()*0.6-0.3)*TW;
  var target=WINDEX*TW-(cw/2-TW/2)+jitter;
  var now=function(){ return (typeof performance!=="undefined"&&performance.now)?performance.now():Date.now(); };
  var start=now(), dur=4300, last=-1;
  function step(){
    var t=Math.min(1,(now()-start)/dur);
    var e=1-Math.pow(1-t,4);
    var pos=target*e;
    strip.style.transform='translateX('+(-pos)+'px)';
    var idx=Math.round((pos+cw/2-TW/2)/TW);
    if(idx!==last){ last=idx; beep(1100,.02,"square",.035); }
    if(t<1) requestAnimationFrame(step); else finishCrate(winId);
  }
  requestAnimationFrame(step);
}
function finishCrate(id){
  var c=CHARS[id], rar=RARITY[c.rar];
  var res=document.getElementById('crateRes'), claim=document.getElementById('btnClaim');
  var reel=document.getElementById('reel');
  reel.classList.add('win');
  reel.style.borderColor=rar.col;
  var maxed=(BOOST[id]||0)>=MAXBOOST;
  if(maxed){
    CASH+=250;
    res.innerHTML='<span class="big2" style="color:'+rar.col+'">'+rar.name+'</span><br>'+
      c.name+' is already maxed — refunded $250';
    beep(300,.2,"square",.05);
  } else {
    applyBoost(id,true);
    res.innerHTML='<span class="big2" style="color:'+rar.col+'">'+rar.name+'</span><br>'+
      c.name+' &nbsp;BOOST ×'+BOOST[id]+'<br>+'+(50*BOOST[id])+'% HP · +'+(10*BOOST[id])+'% damage';
    var notes=[392,523,659,784,988,1319];
    var n=["common","rare","epic","mythic","legendary"].indexOf(c.rar);
    for(var q=0;q<=n+1;q++)(function(q){ setTimeout(function(){ beep(notes[q],.16,"square",.075); },q*110); })(q);
    if(n>=3) flashScreen(.5);
  }
  document.getElementById('crateout').innerHTML=
    '<b style="color:'+rar.col+'">'+rar.name+'</b> &nbsp;'+c.name+(maxed?' (refunded)':' ×'+BOOST[id]);
  saveAll(); refreshCards(); updateShop();
  claim.style.display='';
  spinning=false;
}
function updateShop(){
  var el=document.getElementById('cash'); if(el) el.textContent="$"+CASH;
  var buy=document.getElementById('btnBuy'), c=CHARS[S.pick];
  if(buy){
    if(isLocked(S.pick)){
      buy.style.display="";
      buy.textContent = CASH>=c.price ? ("Unlock "+c.name+" — $"+c.price) : ("Locked — need $"+(c.price-CASH)+" more");
      buy.disabled = CASH<c.price;
      buy.style.opacity = CASH>=c.price?1:.5;
    } else buy.style.display="none";
  }
  var go=document.getElementById('btnGo');
  if(go) go.style.display=isLocked(S.pick)?"none":"";
  var bb=document.getElementById('btnBoost');
  if(bb){
    var bs=Math.min(MAXBOOST,BOOST[S.pick]||0);
    if(bs>=MAXBOOST){ bb.textContent="BOOST MAXED ★★★★★"; bb.classList.add('off'); }
    else {
      var cost=boostPriceFor(S.pick);
      bb.textContent="BOOST"+(bs?" ×"+bs:"")+" · $"+cost;
      bb.classList.toggle('off',CASH<cost);
    }
  }
  var cb=document.getElementById('btnCrate');
  if(cb) cb.classList.toggle('off',CASH<CRATE_COST);
}

var stickId=null, sBase={x:0,y:0}, RADIUS=52, stickJump=false;
function knobReset(){ knob.style.transform="translate(0px,0px)"; IN.left=0; IN.right=0;
  if(stickJump){ IN.hold=0; stickJump=false; } }
function stickStart(e){
  if(stickId!==null) return;
  stickId=e.pointerId;
  var r=stick.getBoundingClientRect();
  sBase.x=r.left+r.width/2; sBase.y=r.top+r.height/2;
  stickMove(e);
}
function stickMove(e){
  if(e.pointerId!==stickId) return;
  var dx=e.clientX-sBase.x, dy=e.clientY-sBase.y;
  var d=Math.hypot(dx,dy);
  if(d>RADIUS){ dx*=RADIUS/d; dy*=RADIUS/d; }
  knob.style.transform="translate("+dx+"px,"+dy+"px)";
  IN.left = dx<-12?1:0; IN.right = dx>12?1:0;
  if(dy<-30){ IN.jump=1; IN.hold=1; stickJump=true; }
  else if(stickJump){ IN.hold=0; stickJump=false; }
}
function stickEnd(e){ if(e.pointerId!==stickId)return; stickId=null; knobReset(); }
stick.addEventListener('pointerdown',function(e){ e.preventDefault(); stick.setPointerCapture(e.pointerId); stickStart(e); });
stick.addEventListener('pointermove',function(e){ e.preventDefault(); stickMove(e); });
stick.addEventListener('pointerup',stickEnd);
stick.addEventListener('pointercancel',stickEnd);
// dragging anywhere on the left half also drives the stick
CV.addEventListener('pointerdown',function(e){
  if(S.scene!=="fight") return;
  if(e.clientX>window.innerWidth*0.5) return;
  e.preventDefault(); stickId=e.pointerId;
  var r=stick.getBoundingClientRect(); sBase.x=r.left+r.width/2; sBase.y=r.top+r.height/2;
  stickMove(e);
});
window.addEventListener('pointermove',function(e){ if(stickId===e.pointerId) stickMove(e); });
window.addEventListener('pointerup',stickEnd);
window.addEventListener('pointercancel',stickEnd);

/* action buttons */
[['bAtk','atk'],['bSpec','spec'],['bJump','jump'],['bBlock','block'],['bAbil','abil']].forEach(function(pair){
  var el=document.getElementById(pair[0]), k=pair[1];
  function on(e){ e.preventDefault(); e.stopPropagation(); IN[k]=1; if(k==="jump") IN.hold=1; el.classList.add('hot');
    try{ el.setPointerCapture(e.pointerId); }catch(err){} }
  function off(e){ if(e){e.preventDefault(); e.stopPropagation();}
    if(k==="block") IN[k]=0; if(k==="jump") IN.hold=0; el.classList.remove('hot'); }
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
});

/* keyboard */
var KEYMAP={a:"left",arrowleft:"left",d:"right",arrowright:"right",w:"jump",arrowup:"jump"," ":"jump",e:"abil",q:"abil",
 j:"atk",z:"atk",k:"spec",x:"spec",l:"block",shift:"block",s:"block",arrowdown:"block"};
/* true when the user is typing into the join-code or cheat box - game
   keybinds must stay out of the way or letters never reach the field */
function typingInField(e){
  var t=(e&&e.target)||document.activeElement;
  if(!t) return false;
  var tag=(t.tagName||"").toLowerCase();
  return tag==="input"||tag==="textarea"||tag==="select"||t.isContentEditable;
}
window.addEventListener('keydown',function(e){
  if(typingInField(e)){
    if(e.key==="Enter"){
      if(e.target&&e.target.id==="joinCode") document.getElementById('btnJoin').click();
      else if(e.target&&e.target.id==="cheat") document.getElementById('btnCheat').click();
    }
    return;
  }
  var k=e.key.toLowerCase();
  if(k==="m"){ toggleSound(); return; }
  if(/^[0-9]$/.test(k)){ S.seq=((S.seq||"")+k).slice(-4); if(S.seq==="1212"&&S.scene!=="fight"){ S.seq=""; tryCheat("1212"); } }
  var m=KEYMAP[k]; if(m){ e.preventDefault(); IN[m]=1; if(m==="jump") IN.hold=1; }
  if(k==="enter"&&S.scene!=="fight"&&S.scene!=="vs"){
    if(S.scene==="title")setScene("select"); else startFight(); }
});
window.addEventListener('keyup',function(e){
  if(typingInField(e)) return;
  var m=KEYMAP[e.key.toLowerCase()];
  if(m){ e.preventDefault(); if(m==="left"||m==="right"||m==="block") IN[m]=0; if(m==="jump") IN.hold=0; }
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
refreshIcons();
document.getElementById('btnMute').addEventListener('click',function(e){
  e.preventDefault(); e.stopPropagation(); toggleSound();
});
syncMuteBtn();
function firstTouch(){ if(S.scene!=="fight") startTune(); }
window.addEventListener('pointerdown',firstTouch);
window.addEventListener('keydown',firstTouch);
setScene("title");
})();
</script>
